name: oneoff-kg-cm
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: [self-hosted]
    env: { KUBECONFIG: /tmp/k3s.yaml }
    steps:
      - name: Apply configmap + restart bot
        run: |
          K="/usr/local/bin/k3s kubectl --insecure-skip-tls-verify -n kindergarten"
          echo "" | base64 -d > /tmp/kg-cm.yaml
          $K apply -f /tmp/kg-cm.yaml
          $K rollout restart deploy/kindergarten-bot
          $K rollout status deploy/kindergarten-bot --timeout=120s
