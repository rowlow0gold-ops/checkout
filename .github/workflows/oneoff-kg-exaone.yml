name: oneoff-kg-exaone
on:
  workflow_dispatch:
    inputs:
      gh_token: { required: true }
jobs:
  deploy:
    runs-on: [self-hosted]
    env: { KUBECONFIG: /tmp/k3s.yaml }
    steps:
      - name: Pull EXAONE, apply config, rebuild bot
        run: |
          set -e
          K="/usr/local/bin/k3s kubectl --insecure-skip-tls-verify -n kindergarten"
          echo "Pulling EXAONE model (may take a few minutes)..."
          $K exec deploy/ollama -- ollama pull exaone3.5:2.4b
          echo "" | base64 -d > /tmp/kg-cm.yaml
          $K apply -f /tmp/kg-cm.yaml
          TAG="exaone-$(date +%s)"
          rm -rf /tmp/kgb && git clone -q https://x-access-token:${{ github.event.inputs.gh_token }}@github.com/rowlow0gold-ops/kindergarten_backend.git /tmp/kgb
          cd /tmp/kgb
          docker build -t kindergarten-bot:$TAG .
          docker save kindergarten-bot:$TAG | /usr/local/bin/k3s ctr -n k8s.io images import -
          $K set image deploy/kindergarten-bot bot=kindergarten-bot:$TAG
          $K patch deploy kindergarten-bot -p '{"spec":{"template":{"spec":{"containers":[{"name":"bot","imagePullPolicy":"Never"}]}}}}'
          $K rollout status deploy/kindergarten-bot --timeout=180s
