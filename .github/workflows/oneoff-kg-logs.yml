name: oneoff-kg-logs
on: { workflow_dispatch: {} }
jobs:
  logs:
    runs-on: [self-hosted]
    env: { KUBECONFIG: /tmp/k3s.yaml }
    steps:
      - name: Bot logs
        run: |
          K="/usr/local/bin/k3s kubectl --insecure-skip-tls-verify -n kindergarten"
          $K logs deploy/kindergarten-bot --tail=150 | grep -iE "turnstile|forbidden|403|error|warn|exception" | tail -40 || echo "no matching log lines"
