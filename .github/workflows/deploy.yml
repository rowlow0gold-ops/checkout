name: Deploy Checkout

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy (home server)
    runs-on: [self-hosted, home]
    steps:
      - name: Sync source on home server
        run: |
          cd /home/jj/apps/checkout
          git fetch origin main
          git reset --hard origin/main

      - name: Rebuild & restart containers
        run: |
          cd /home/jj/apps/stack
          docker compose --env-file .env build checkout-backend checkout-frontend
          docker compose --env-file .env up -d --no-deps checkout-backend checkout-frontend

      - name: Flush Redis cache
        run: docker exec redis7 redis-cli FLUSHALL

      - name: Health check
        run: |
          sleep 5
          curl -fsS http://127.0.0.1:8082/api/health
