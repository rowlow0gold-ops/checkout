name: oneoff-kg-backend
on:
  workflow_dispatch:
    inputs:
      gh_token:
        required: true
jobs:
  build-deploy:
    runs-on: [self-hosted]
    env:
      KUBECONFIG: /tmp/k3s.yaml
    steps:
      - name: Build kindergarten backend & deploy to k3s
        run: |
          set -e
          rm -rf /tmp/kgbuild
          git clone -q https://x-access-token:${{ github.event.inputs.gh_token }}@github.com/rowlow0gold-ops/kindergarten_backend.git /tmp/kgbuild
          cd /tmp/kgbuild
          docker build -t kindergarten-bot:stream .
          docker save kindergarten-bot:stream | /usr/local/bin/k3s ctr -n k8s.io images import -
          K="/usr/local/bin/k3s kubectl --insecure-skip-tls-verify -n kindergarten"
          $K set image deploy/kindergarten-bot bot=kindergarten-bot:stream
          $K patch deploy kindergarten-bot -p '{"spec":{"template":{"spec":{"containers":[{"name":"bot","imagePullPolicy":"Never"}]}}}}'
          $K rollout status deploy/kindergarten-bot --timeout=180s
          $K get pods
