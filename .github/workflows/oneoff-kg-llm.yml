name: oneoff-kg-llm
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: [self-hosted]
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    steps:
      - name: Apply kindergarten LLM speedups
        run: |
          echo "" | base64 -d > /tmp/kg-cm.yaml
          echo "" | base64 -d > /tmp/kg-oll.yaml
          kubectl apply -f /tmp/kg-cm.yaml
          kubectl apply -f /tmp/kg-oll.yaml
          kubectl -n kindergarten rollout restart deployment/kindergarten-bot
          kubectl -n kindergarten rollout status deployment/ollama --timeout=240s
          kubectl -n kindergarten get pods
