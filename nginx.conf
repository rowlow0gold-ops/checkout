server {
    listen 80;
    server_name checkout.minhojan-world.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name checkout.minhojan-world.site;

    ssl_certificate     /etc/letsencrypt/live/checkout.minhojan-world.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checkout.minhojan-world.site/privkey.pem;

    # React frontend — static build
    root /var/www/checkout/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI backend
    location /api/ {
        proxy_pass http://localhost:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
