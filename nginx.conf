server {
    listen 80;
    server_name checkout.minhojan-world.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name checkout.minhojan-world.site;

    ssl_certificate     /etc/letsencrypt/live/checkout.minhojan-world.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checkout.minhojan-world.site/privkey.pem;

    # Security headers (apply to all responses, including errors)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' https: data: blob:; connect-src 'self' https://*.minhojan-world.site wss://*.minhojan-world.site; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    # React frontend — static build
    root /var/www/checkout/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI backend
    location /api/ {
        proxy_pass http://localhost:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
